# =============================================================================
# XStore CI/CD - build & publish Docker images
#
# Jobs:
#   1. test        unit + integration tests, plus a live smoke test of the API
#                  against REAL PostgreSQL 16 and Redis 7 service containers
#   2. compose     validates docker-compose.yml (config + interpolation)
#   3. build       builds apps/api and apps/web images and pushes them to
#                  GitHub Container Registry (ghcr.io)
#
# Trigger: push to main / any arena/* branch, tags v*, or manual dispatch.
# =============================================================================
name: docker-build

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------ tests
  test:
    name: Test & smoke (PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xstore
          POSTGRES_PASSWORD: xstore
          POSTGRES_DB: xstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xstore -d xstore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://xstore:xstore@127.0.0.1:5432/xstore_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters
      NODE_ENV: development
      # Production path: schema comes from SQL migrations, never auto-sync.
      DB_SYNC: 'false'
      SEED_SUPER_ADMIN: 'true'
      SUPER_ADMIN_EMAIL: admin@xstore.id
      SUPER_ADMIN_PASSWORD: ChangeMe123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Build backend
        working-directory: apps/api
        run: npm run build

      - name: Run unit + integration tests
        working-directory: apps/api
        run: npm test

      - name: Run SQL migrations (real PostgreSQL)
        working-directory: apps/api
        run: npm run migration:run

      - name: Seed database (real PostgreSQL)
        working-directory: apps/api
        run: npm run seed

      - name: Smoke test the real API server
        working-directory: apps/api
        run: |
          set -e
          node dist/main.js &
          API_PID=$!
          echo "API pid: $API_PID"

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4000/api/health > /tmp/health.json; then
              break
            fi
            echo "waiting for API... ($i)"
            sleep 2
          done

          echo "--- /api/health ---"
          cat /tmp/health.json
          curl -sf http://127.0.0.1:4000/api/health > /dev/null

          echo "--- register ---"
          curl -sf -X POST http://127.0.0.1:4000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-user@example.com","password":"CiPassword123!","name":"CI User"}' \
            | grep -q accessToken

          echo "--- login (seeded super admin) ---"
          curl -sf -X POST http://127.0.0.1:4000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@xstore.id","password":"ChangeMe123!"}' \
            | grep -q accessToken

          echo "--- unauthenticated admin route must be 401 ---"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/admin/servers)
          test "$STATUS" = "401"

          echo "--- forged webhook must be 401 ---"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4000/api/webhooks/bayargg \
            -H 'x-webhook-signature: forged' -H 'x-webhook-timestamp: 1' \
            -H 'Content-Type: application/json' \
            -d '{"invoice_id":"X","status":"paid","final_amount":1}')
          test "$STATUS" = "401"

          kill $API_PID
          echo "Smoke test PASSED"

  # --------------------------------------------------------- compose check
  compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from template
        run: |
          cp .env.example .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://xstore:ci@db:5432/xstore|' .env
          sed -i 's|^REDIS_URL=.*|REDIS_URL=redis://:ci@redis:6379|' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' .env
          sed -i 's/^DOMAIN=.*/DOMAIN=ci.example.com/' .env

      - name: docker compose config
        run: |
          docker compose version
          docker compose config --quiet
          echo "compose file is valid"
          docker compose config | grep -E '^\s{2}\w+:' | head -20

  # ------------------------------------------------------- build & publish
  build:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    needs: [test, compose]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch names may contain "/" (e.g. arena/502c634c-xstore), which is not
      # valid in a Docker tag - sanitise it before use.
      - name: Compute image tags
        id: tags
        run: |
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "ref=$SAFE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/xstore-api:${{ steps.tags.outputs.ref }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/xstore-api:${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/xstore-web:${{ steps.tags.outputs.ref }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/xstore-web:${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Publish image summary
        run: |
          {
            echo "## 🐳 Images published"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| \`ghcr.io/${{ github.repository_owner }}/xstore-api\` | \`${{ steps.tags.outputs.ref }}\`, \`${{ steps.tags.outputs.sha }}\` |"
            echo "| \`ghcr.io/${{ github.repository_owner }}/xstore-web\` | \`${{ steps.tags.outputs.ref }}\`, \`${{ steps.tags.outputs.sha }}\` |"
            echo ""
            echo "Pull & run:"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/xstore-api:${{ steps.tags.outputs.ref }}"
            echo "docker pull ghcr.io/${{ github.repository_owner }}/xstore-web:${{ steps.tags.outputs.ref }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
